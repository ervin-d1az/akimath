# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

# ── Metrics ──────────────────────────────────────────────────────────────────
#
# `dart_code_linter` has been a dev dependency since the app was scaffolded and
# `dart run dart_code_linter:metrics analyze lib` reported nothing at all,
# because without this block there is nothing to report. CLAUDE.md said so:
# *"green by construction, so it is not evidence until someone configures it."*
#
# **The thresholds are set at what the code does today, not at a number from a
# blog post.** A gate tuned above the worst file passes for ever and teaches
# nobody anything; one tuned below it is red on arrival and gets deleted in a
# week. These are the current ceilings, so the next function that goes past one
# is a decision somebody makes on purpose — and the numbers ratchet down as the
# code gets simpler, never up to accommodate it.
dart_code_linter:
  metrics:
    # How many independent paths through a function. The ceiling is the widest
    # thing in the app today; anything wider is a function that wants splitting
    # before it wants a bigger number.
    cyclomatic-complexity: 20
    # Nesting is what makes a widget tree unreadable, and it is the one metric a
    # `build` method genuinely earns some of.
    maximum-nesting-level: 6
    # A function longer than this is doing two things.
    source-lines-of-code: 120
    # More than this and the call site is a puzzle. Named parameters do not
    # help: the reader still has to hold them all.
    number-of-parameters: 8
  metrics-exclude:
    - test/**
    - integration_test/**
    # Every screen in one list, so the design gates can walk them. It is a
    # registry, not logic, and its length is the point.
    - test/design/screen_registry.dart
