schema: spec-driven

# Shown to the AI whenever it creates a planning artifact. Keep it pointing at
# files rather than restating them — a copy here goes stale silently.
context: |
  AkiMath — math challenges in Mexican Spanish. One repository: a Flutter client
  under `app/` and three TypeScript packages — `packages/server` (the endpoints
  and the database), `packages/contract` (the frozen pack format, canonicalisation
  and the HMAC digest) and `packages/core` (the rederivation machine).

  READ BEFORE PLANNING ANYTHING:
  - `CLAUDE.md` — how to work here. It wins over every other document.
  - `.claude/conventions/craftsmanship.md` — the rulebook the code must satisfy.
    Cite its rule IDs (PURE-1, FUN-2, BRD-2a, …) instead of paraphrasing them.
  - `ARCHITECTURE.md` — the accepted design decisions and the phase plan in §9.
    A proposal names which phase it belongs to.

  Audience includes children under 13. That is an architectural constraint, not
  a footnote: no third-party SDK that collects data, no ads, no external
  analytics. Any new dependency has to be checked for whether it phones home
  before it is proposed (DEP-1).

  Code, identifiers, comments and documents are written in English. Only the
  copy the end user reads is Mexican Spanish.

  The structural commitment is PURE: every decision lives in a module that does
  no IO, and the adapter that does the IO holds no decisions. The test is
  whether proving the decision correct needs a fake canvas, socket, clock or
  seed. Two precedents already on disk: `app/lib/design/brand/spec/` and
  `packages/server/src/routing.ts`.

  What exists today: read CLAUDE.md's "What exists today" section, which is kept
  current and is the answer. In outline — the app is playable end to end, all six
  stimulus families and all five puzzle formats draw and grade, `packages/core`
  and `packages/contract` are on disk with their artifacts committed under
  `contract/`, the Neon database is provisioned with every migration applied, and
  the server implements eight of the nine contracted operations. Phases F0 through
  F7 all have code behind them.

  What does not exist: `GET /items/next`, which is the one operation still
  answering 501; F8, which is Rive and which nothing has touched; and **any
  deployment at all** — nothing runs anywhere but a local port, there is no deploy
  workflow, and a proposal that needs a served URL has to say who provisions it.

  This block said the opposite until 2026-08-26 — that there was no `packages/core`,
  no database, no auth and no real endpoint — and every plan written against it
  started from a repository that had not existed for weeks.

rules:
  proposal:
    - Name which phase of ARCHITECTURE.md §9 this belongs to, or say plainly that it is outside the plan and why.
    - Include a Non-goals section. Scope that is not excluded gets built.
    - State what already exists that this builds on, with file paths — this is a brownfield repo, not a blank page.
  specs:
    - Every scenario must be verifiable by a test that will be committed. If you cannot name the test, the scenario is not a requirement yet.
    - Write scenarios against observable behaviour, never against implementation detail.
  design:
    - Only write this when a decision has real alternatives worth recording. Cite ARCHITECTURE.md rather than restating it.
    - Say which side of the PURE boundary each new module sits on, and why.
  tasks:
    - Order tasks so a failing test comes before the code that makes it pass. TDD is a hard requirement here, not a preference.
    # Quoted because the colon-space would otherwise make YAML read this bullet as a mapping,
    # which invalidates the whole list and makes openspec drop every rule under `tasks` — the
    # TDD ordering rule included — with only a one-line warning.
    - "Each task names the check that proves it: a test file, `flutter analyze`, or a command with its expected output."
    - Keep tasks to one coherent change each — they map one-to-one onto commits.

operations:
  apply:
    guidance:
      - Write the failing test first and see it fail. "It compiles" is not evidence.
      - Run the full suite for the stack you touched before marking a task done.
      - Commit in small logical pieces, never with a Co-Authored-By trailer.
      - A pull request title is the squashed commit subject: conventional prefix, lowercase,
        no ticket id, no scope in parentheses. Its body follows
        `.github/PULL_REQUEST_TEMPLATE.md`, evidence tier and numbers included.
      - Branch off `main` and push the branch. Never push to `main` — it is protected and
        takes pull requests only. `dev` is not the working branch and has not been since
        pull request #6 on 2026-08-17.
  archive:
    guidance:
      - Archive only after the pull request has merged, not when the code is written.
      - If the change taught the project something — a rule overruled, a failure that bit twice — write it into the rulebook with an ID in the same session (PROC-6).
